version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      # Atualizações pequenas juntas num PR só; versões novas grandes vêm separadas.
      app:
        dependency-type: production
        update-types: [minor, patch]
      ferramentas:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Sao_Paulo
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
