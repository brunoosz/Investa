name: Investa - build e release

on:
  push:
    branches: ["main", "master", "claude/**"]
    tags: ["v*"]
    # Mudanças só no README ou nas imagens não geram uma release nova.
    paths-ignore:
      - "README.md"
      - "docs/**"
      - "scripts/capture.mjs"
      - ".github/workflows/media.yml"
  workflow_dispatch:

# Só leitura por padrão; os jobs que publicam a release pedem escrita.
permissions:
  contents: read

concurrency:
  group: investa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Testes e dados reais (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Fontes de dados reais (Yahoo Finance, Banco Central, Tesouro, notícias)
        run: node dist-electron/smoke.js
        continue-on-error: true
      - name: Teste de ponta a ponta do aplicativo (Electron)
        run: xvfb-run -a -s "-screen 0 1440x900x24" node scripts/e2e.mjs
        env:
          SHOTS: e2e-shots
      - name: Guardar prints das telas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prints-das-telas
          path: e2e-shots/
          if-no-files-found: ignore

  windows:
    name: Instalador Windows (.exe)
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write
    # Nuvem (Supabase): Settings → Secrets and variables → Actions. Sem os
    # segredos, o app sai com contas só locais.
    env:
      INVESTA_CLOUD_URL: ${{ secrets.INVESTA_CLOUD_URL }}
      INVESTA_CLOUD_KEY: ${{ secrets.INVESTA_CLOUD_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Definir versão
        shell: bash
        run: |
          VERSION="1.0.$GITHUB_RUN_NUMBER"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - run: npm run build
      - name: Gerar instalador e versão portátil
        run: npx electron-builder --win --x64 --publish never
      - name: Guardar .exe
        uses: actions/upload-artifact@v4
        with:
          name: Investa-Windows-${{ env.VERSION }}
          path: release/*.exe
      - name: Publicar na página de Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Investa ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: "true"
          files: release/*.exe
          body: |
            ## Como instalar

            **Windows**
            - **Investa-Setup-${{ env.VERSION }}.exe**: instalador (recomendado). Cria atalho na área de trabalho e no menu Iniciar.
            - **Investa-Portatil-${{ env.VERSION }}.exe**: versão portátil, roda sem instalar.

            Na primeira vez, o Windows pode mostrar "O Windows protegeu o computador" (o app ainda não tem certificado de assinatura). Clique em **Mais informações → Executar assim mesmo**.

            **Android**
            - **Investa-Android-${{ env.VERSION }}.apk**: baixe pelo celular e abra o arquivo. Se o Android pedir, permita "instalar apps desta fonte" para o navegador ou o gerenciador de arquivos. As próximas versões instalam por cima, sem perder os dados.

            ## Primeiro acesso

            1. Crie a primeira conta: ela será a conta **Dono**.
            2. Responda o questionário (renda, gastos, quanto pode investir, perfil).
            3. Para ativar o Assistente: **Configurações → Inteligência Artificial** e cole sua chave da NVIDIA (`nvapi-...`). No celular, a chave é configurada separadamente.

  android:
    name: App Android (.apk)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Publica na mesma release criada pelo job do Windows.
    needs: windows
    permissions:
      contents: write
    # Nuvem (Supabase): Settings → Secrets and variables → Actions. Sem os
    # segredos, o app sai com contas só locais.
    env:
      INVESTA_CLOUD_URL: ${{ secrets.INVESTA_CLOUD_URL }}
      INVESTA_CLOUD_KEY: ${{ secrets.INVESTA_CLOUD_KEY }}
      # Chave de assinatura própria (recomendado). Sem estes segredos, o APK é
      # assinado com a chave pública do repositório (android/app/investa.keystore).
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Definir versão
        run: |
          echo "VERSION=1.0.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.0.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
      - name: Chave de assinatura do APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/investa-release.keystore"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/investa-release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::Sem o segredo ANDROID_KEYSTORE_BASE64: o APK sai com a chave pública do repositório."
          fi
      - run: npm run typecheck
      - run: npx vite build
      - run: npx cap sync android
      - name: Gerar APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Renomear APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk "release/Investa-Android-${VERSION}.apk"
      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Investa-Android-${{ env.VERSION }}
          path: release/*.apk
      - name: Publicar na página de Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          files: release/*.apk
